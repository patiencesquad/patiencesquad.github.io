<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dd</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      line-height: 1.7;
      padding: 40px 20px;
    }
    .devlog-container {
      max-width: 900px;
      margin: 0 auto;
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
    }
    .manifest {
      background: #111;
      border-bottom: 2px solid #00ccff;
      padding: 28px 32px;
    }
    .manifest-title {
      color: #00ccff;
      font-size: 28px;
      margin: 0 0 8px 0;
      font-weight: normal;
      letter-spacing: -0.3px;
    }
    .manifest-desc {
      color: #aaa;
      font-size: 15px;
      margin: 12px 0 0 0;
      font-style: italic;
      border-left: 2px solid #00ccff;
      padding-left: 16px;
    }
    .manifest-date {
      color: #00ccff;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 16px;
      opacity: 0.8;
    }
    .content {
      padding: 32px;
      background: #0a0a0a;
    }
    .content h1, .content h2, .content h3 {
      color: #00ccff;
      font-weight: normal;
      margin-top: 24px;
      margin-bottom: 12px;
    }
    .content h1 { font-size: 26px; }
    .content h2 { font-size: 20px; }
    .content h3 { font-size: 17px; }
    .content p {
      margin: 1em 0;
    }
    .content ul, .content ol {
      margin: 12px 0;
      padding-left: 28px;
    }
    .content li {
      margin: 6px 0;
    }
    .content blockquote {
      border-left: 3px solid #00ccff;
      margin: 16px 0;
      padding-left: 20px;
      color: #bbb;
      font-style: italic;
    }
    .content img {
      max-width: 100%;
      border-radius: 8px;
      margin: 20px 0;
      border: 1px solid #2a2a2a;
    }
    .content a {
      color: #00ccff;
      text-decoration: none;
      border-bottom: 1px dotted #00ccff;
    }
    .content a:hover {
      border-bottom: 1px solid;
    }
    .content pre {
      background: #111;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: monospace;
      border: 1px solid #2a2a2a;
    }
    hr {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 24px 0;
    }
  </style>
</head>
<body>
  <div class="devlog-container">
    
        <div class="manifest">
          <h2 class="manifest-title">dd</h2>
          <div class="manifest-desc">ddddd</div>
          <div class="manifest-date">2026-05-29</div>
        </div>
      
    <div class="content">
      <p>начни</p>
    </div>
  </div>
</body>
</html>
