<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UNDERTALE CYAN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.3">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <div class="lang-switcher">
    <button class="lang-btn active" data-lang="ru">RUS</button>
    <button class="lang-btn" data-lang="en">ENG</button>
  </div>

  <div class="topbar hidden" id="topbar">
    <div class="nav">
      <div class="nav-links">
        <div class="nav-item" data-section="home" data-ru="Главная" data-en="Home">Главная</div>
        <div class="nav-item" data-section="links" data-ru="Ссылки" data-en="Links">Ссылки</div>
        <div class="nav-item" data-section="about" data-ru="О проекте" data-en="About">О проекте</div>
        <a href="dv.html" class="nav-item" data-ru="Девлоги" data-en="Devlogs">Девлоги</a>
      </div>
    </div>
  </div>

  <div class="fade" id="fade"></div>

  <div class="content" id="mainContent">
    <div class="title" id="home">
      <img src="assets/title.png" alt="Title" id="titleImg"/>
    </div>

    <div class="text" id="mainText">
      <span data-ru="- Ты любишь мороженое? Мы тоже!

--- Изменения на сайте ---
* Ничего необычного.
* Или нет?.." data-en="- Do you like ice cream? We too!

--- Site Changelog ---
* Nothing special.
* Or not?">- Do you like ice cream? We too!

--- Site Changelog ---
* Nothing special.
* Or not?</span>
    </div>

    <div class="about" id="about">
      <div class="about-left">
        <div class="about-title" data-ru="О проекте:" data-en="About:">О сайте:</div>
        <div class="about-text" data-ru="UNDERTALE CYAN - Фанатский проект о голубой душе ТЕРПЕНИЯ. Проведите человека через подземелья живым." data-en="UNDERTALE CYAN - A fan project about the blue soul of PATIENCE. Guide a human through undergroud alive.">Проект очень крутой, как Toby Fox и команда patience squad</div>
      </div>
      <div class="about-right">
        <video controls src="assets/preview.mp4" class="about-video"></video>
      </div>
    </div>

    <div class="socials" id="links">
      <div class="socials-title" data-ru="Наши соц-сети" data-en="Our socials">Наши соц-сети</div>
      <div class="social-icons">
        <a href="https://youtube.com/@patiencesquad?si=76xpkyATYEUaJwHm" target="_blank">
          <img src="assets/youtube.png" alt="YouTube">
        </a>
        <a href="https://www.tiktok.com/@undertalecyan?_r=1&_t=ZS-93OHkMCsPcP" target="_blank">
          <img src="assets/tiktok.png" alt="TikTok">
        </a>
        <a href="https://t.me/PS_Cyan" target="_blank">
          <img src="assets/telegram.png" alt="Telegram">
        </a>
      </div>
    </div>
  </div>

  <script>
    const content = document.getElementById('mainContent');
    const topbar = document.getElementById('topbar');
    const fade = document.getElementById('fade');
    const navItems = document.querySelectorAll('.nav-item');
    const langBtns = document.querySelectorAll('.lang-btn');
    const titleImg = document.getElementById('titleImg');
    
    let currentLang = 'ru';
    let clickCount = 0;
    let clickTimeout;

    function setLanguage(lang) {
      currentLang = lang;
      
      document.querySelectorAll('[data-ru][data-en]').forEach(element => {
        if (element.tagName === 'SPAN' || element.classList.contains('nav-item') || 
            element.classList.contains('about-title') || element.classList.contains('about-text') ||
            element.classList.contains('socials-title')) {
          element.textContent = element.getAttribute(`data-${lang}`);
        } else {
          const textElement = element.querySelector('span');
          if (textElement && textElement.hasAttribute('data-ru')) {
            textElement.textContent = textElement.getAttribute(`data-${lang}`);
          }
        }
      });
      
      document.querySelectorAll('.nav-item').forEach(item => {
        item.textContent = item.getAttribute(`data-${lang}`);
      });
      
      langBtns.forEach(btn => {
        if (btn.getAttribute('data-lang') === lang) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    setTimeout(() => {
      fade.classList.add('hidden');
      content.classList.add('visible');
      topbar.classList.remove('hidden');
    }, 100);

    titleImg.addEventListener('click', () => {
      clickCount++;
      clearTimeout(clickTimeout);
      clickTimeout = setTimeout(() => clickCount = 0, 1500);

      if (clickCount >= 3) {
        window.location.href = 'hereweare.html';
        clickCount = 0;
      }
    });

    navItems.forEach(item => {
      item.addEventListener('click', () => {
        const sectionId = item.getAttribute('data-section');
        const targetElement = document.getElementById(sectionId);
        
        if (targetElement) {
          targetElement.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
        
        navItems.forEach(nav => nav.classList.remove('active'));
        item.classList.add('active');
      });
    });
    
    langBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const lang = btn.getAttribute('data-lang');
        setLanguage(lang);
      });
    });
    
    setLanguage('ru');
  </script>

</body>
</html>
