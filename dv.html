<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>UNDERTALE CYAN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="assets/css/dv.css">

  <style>

    .devlog-viewer {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
      animation: fadeIn .3s ease;
    }

    .devlog-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

.devlog-card {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
  transition: .2s ease;
  box-sizing: border-box;
}

.devlog-card:hover {
  border-color: #00ccff;
  transform: translateY(-2px);
}

.devlog-content {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
  width: 100%;
}

.devlog-name {
  font-size: 28px;
  color: white;
  font-weight: bold;
  text-align: left;
  width: 100%;
}

.devlog-description {
  font-size: 16px;
  color: rgba(255,255,255,0.75);
  text-align: left;
  width: 100%;
  line-height: 1.6;
}

.devlog-update {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  width: 100%;
}

.update-label {
  color: #00ccff;
  font-size: 14px;
}

.update-date {
  color: white;
  font-size: 14px;
}

.view-btn {
  margin-top: 10px;
  background: #111;
  border: 2px solid #00ccff;
  color: #00ccff;
  padding: 12px 20px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
  font-family: inherit;
  transition: .2s ease;
  align-self: flex-start;
}

.view-btn:hover {
  background: #00ccff;
  color: #000;
}

#devlogs-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

    .btn-back {
      background: #111;
      border: 2px solid #00ccff;
      color: #00ccff;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 16px;
      font-family: inherit;
      transition: .2s;
      border-radius: 8px;
    }

    .btn-back:hover {
      background: #00ccff;
      color: #000;
    }

    .viewer-title {
      font-size: 42px;
      color: white;
      margin: 0;
    }

    .viewer-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 35px;
    }

    .viewer-meta-item {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
      min-width: 180px;
    }

    .viewer-meta-label {
      color: #00ccff;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .viewer-meta-value {
      color: white;
      font-size: 16px;
    }

    .viewer-content {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 35px;
      color: white;
      line-height: 1.8;
      font-size: 18px;
    }

    .viewer-content img {
      max-width: 100%;
      border-radius: 12px;
    }

    .viewer-content h1,
    .viewer-content h2,
    .viewer-content h3 {
      color: #00ccff;
      margin-top: 24px;
    }

    .viewer-content a {
      color: #00ccff;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

  </style>
</head>
<body>

  <div class="lang-switcher">
    <button class="lang-btn active" data-lang="ru">RUS</button>
    <button class="lang-btn" data-lang="en">ENG</button>
  </div>

  <div class="topbar">
    <div class="nav">
      <div class="nav-links">

        <a href="index.html"
           class="nav-item"
           data-ru="Главная"
           data-en="Home">
           Главная
        </a>

        <a href="index.html#links"
           class="nav-item"
           data-ru="Ссылки"
           data-en="Links">
           Ссылки
        </a>

        <a href="index.html#about"
           class="nav-item"
           data-ru="О проекте"
           data-en="About">
           О проекте
        </a>

        <a href="dv.html"
           class="nav-item active"
           data-ru="Девлоги"
           data-en="Devlogs">
           Девлоги
        </a>

      </div>
    </div>
  </div>

  <div class="fade" id="fade"></div>

  <div class="content" id="mainContent">

    <div class="devlogs-container">

      <h1 class="devlogs-title"
          data-ru="Девлоги"
          data-en="Devlogs">
          Девлоги
      </h1>

      <p class="devlogs-subtitle"
         data-ru="Просмотрите девлоги проекта"
         data-en="View project devlogs">
         Просмотрите девлоги проекта
      </p>

      <div id="devlogs-list"></div>

    </div>

  </div>

  <script>

    const fade = document.getElementById('fade');
    const langBtns = document.querySelectorAll('.lang-btn');

    let currentLang = 'ru';

    function setLanguage(lang) {

      currentLang = lang;

      document.querySelectorAll('[data-ru][data-en]').forEach(element => {
        element.textContent = element.getAttribute(`data-${lang}`);
      });

      langBtns.forEach(btn => {

        if (btn.dataset.lang === lang) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }

      });

    }

    setTimeout(() => {
      fade.classList.add('hidden');
    }, 100);

    langBtns.forEach(btn => {

      btn.addEventListener('click', () => {
        setLanguage(btn.dataset.lang);
      });

    });

    setLanguage('ru');

    function escapeHTML(text) {

      if (!text) return '';

      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };

      return text.replace(/[&<>"']/g, m => map[m]);

    }

    fetch('devlog.html')

      .then(response => response.text())

      .then(html => {

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const manifests = doc.querySelectorAll('.manifest');
        const list = document.getElementById('devlogs-list');
        const devlogs = [];
        manifests.forEach((manifest, index) => {

          const title =
            manifest.querySelector('.manifest-title')
            ?.textContent
            ?.trim() || 'No title';

          const description =
            manifest.querySelector('.manifest-desc')
            ?.textContent
            ?.trim() || '';

          const date =
            manifest.querySelector('.manifest-date')
            ?.textContent
            ?.trim() || '';

          const container = manifest.closest('.devlog-container');

          const contentElement =
            container
            ? container.querySelector('.content')
            : null;

          const content =
            contentElement
            ? contentElement.innerHTML
            : '<p>No content</p>';

          const devlog = {
            name: title,
            description: description,
            date: date,
            savedAt: date,
            content: content
          };

          devlogs.push(devlog);

          const card = document.createElement('div');

          card.className = 'devlog-card';

          card.innerHTML = `
            <div class="devlog-content">

              <div class="devlog-name">
                ${escapeHTML(title)}
              </div>

              <div class="devlog-description">
                ${escapeHTML(description)}
              </div>

              <div class="devlog-update">

                <span class="update-label"
                      data-ru="Последнее обновление:"
                      data-en="Last update:">

                      Последнее обновление:
                </span>

                <span class="update-date">
                  ${escapeHTML(date)}
                </span>

              </div>

              <button class="view-btn"
                      onclick="viewDevlog(${index})"
                      data-ru="Просмотреть"
                      data-en="View">

                      Просмотреть
              </button>

            </div>
          `;

          list.appendChild(card);

        });

        window.DEVLOGS = devlogs;

        setLanguage(currentLang);

      })

      .catch(error => {
        console.error('Error loading devlogs:', error);
      });

    function viewDevlog(index) {

      const devlog = window.DEVLOGS[index];

      if (!devlog) return;

      const content = document.getElementById('mainContent');

      content.innerHTML = `

        <div class="devlog-viewer">

          <div class="devlog-header">

            <button class="btn-back"
                    onclick="location.reload()"
                    data-ru="← Назад"
                    data-en="← Back">

                    ← Назад
            </button>

            <h1 class="viewer-title">
              ${escapeHTML(devlog.name)}
            </h1>

          </div>

          <div class="viewer-meta">

            <div class="viewer-meta-item">

              <div class="viewer-meta-label"
                   data-ru="Дата"
                   data-en="Date">

                   Дата
              </div>

              <div class="viewer-meta-value">
                ${escapeHTML(devlog.date)}
              </div>

            </div>

            <div class="viewer-meta-item">

              <div class="viewer-meta-label"
                   data-ru="Сохранено"
                   data-en="Saved">

                   Сохранено
              </div>

              <div class="viewer-meta-value">
                ${escapeHTML(devlog.savedAt)}
              </div>

            </div>

            ${devlog.description ? `

              <div class="viewer-meta-item">

                <div class="viewer-meta-label"
                     data-ru="Описание"
                     data-en="Description">

                     Описание
                </div>

                <div class="viewer-meta-value">
                  ${escapeHTML(devlog.description)}
                </div>

              </div>

            ` : ''}

          </div>

          <div class="viewer-content">
            ${devlog.content}
          </div>

        </div>

      `;

      setLanguage(currentLang);

      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });

    }

  </script>

</body>
</html>
