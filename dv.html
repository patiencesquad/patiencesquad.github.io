<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UNDERTALE CYAN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.3">
  <link rel="stylesheet" href="assets/css/dv.css">
</head>
<body>

  <div class="lang-switcher">
    <button class="lang-btn active" data-lang="ru">RUS</button>
    <button class="lang-btn" data-lang="en">ENG</button>
  </div>

  <div class="topbar" id="topbar">
    <div class="nav">
      <div class="nav-links">
        <a href="index.html" class="nav-item" data-ru="Главная" data-en="Home">Главная</a>
        <a href="index.html#links" class="nav-item" data-ru="Ссылки" data-en="Links">Ссылки</a>
        <a href="index.html#about" class="nav-item" data-ru="О проекте" data-en="About">О проекте</a>
        <a href="dv.html" class="nav-item active" data-ru="Девлоги" data-en="Devlogs">Девлоги</a>
      </div>
    </div>
  </div>

  <div class="fade" id="fade"></div>

  <div class="content" id="mainContent">
    <div class="devlogs-container">
      <h1 class="devlogs-title" data-ru="Девлоги" data-en="Devlogs">Девлоги</h1>
      <p class="devlogs-subtitle" data-ru="Скачайте файл с разработкой проекта" data-en="Download the project development file">Скачайте файл с разработкой проекта</p>
      
      <div class="devlog-card">
        <div class="devlog-preview">
          <img src="assets/preview.png" alt="Devlog Preview" class="preview-image">
        </div>
        <div class="devlog-content">
          <div class="devlog-name" data-ru="Девлог за 28.02.2026" data-en="Devlog in 28.02.2026">Девлог за 28.02.2026</div>
          <div class="devlog-description" data-ru="Подробный отчет о разработке игры, включая концепты, код, арты и многое другое" data-en="Detailed development report including concepts, code, art and more">Подробный отчет о разработке игры, включая концепты, код, арты и многое другое</div>
          <div class="devlog-update">
            <span class="update-label" data-ru="Последнее обновление:" data-en="Last update:">Последнее обновление:</span>
            <span class="update-date">28.02.2026</span>
          </div>
          <a href="assets/devlogs/devlog.docx" class="download-btn" download>
            <span data-ru="Скачать девлог" data-en="Download devlog">Скачать девлог</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const fade = document.getElementById('fade');
    const langBtns = document.querySelectorAll('.lang-btn');
    let currentLang = 'ru';

    function setLanguage(lang) {
      currentLang = lang;
      
      document.querySelectorAll('[data-ru][data-en]').forEach(element => {
        if (element.tagName === 'A' || element.classList.contains('devlogs-title') || 
            element.classList.contains('devlogs-subtitle') || element.classList.contains('devlog-name') ||
            element.classList.contains('devlog-description') || element.classList.contains('update-label') ||
            element.classList.contains('download-btn') || element.querySelector('span')) {
          const spanElement = element.querySelector('span');
          if (spanElement && spanElement.hasAttribute('data-ru')) {
            spanElement.textContent = spanElement.getAttribute(`data-${lang}`);
          } else {
            element.textContent = element.getAttribute(`data-${lang}`);
          }
        }
      });
      
      document.querySelectorAll('.nav-item').forEach(item => {
        item.textContent = item.getAttribute(`data-${lang}`);
      });
      
      langBtns.forEach(btn => {
        if (btn.getAttribute('data-lang') === lang) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    setTimeout(() => {
      fade.classList.add('hidden');
    }, 100);
    
    langBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const lang = btn.getAttribute('data-lang');
        setLanguage(lang);
      });
    });
    
    setLanguage('ru');
  </script>

</body>
</html>
